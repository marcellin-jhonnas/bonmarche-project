<body>

<div id="faux404" style="font-family:Arial,sans-serif;text-align:center;padding:18vh 20px 0;color:#444"><h1 style="font-size:2.2rem;font-weight:600">404</h1><p style="margin-top:10px">Page introuvable.</p></div>
<div id="ecran-connexion" style="display:none">
  <div class="box-connexion">
    <h2><i class="fas fa-motorcycle"></i> Espace Livreur</h2>
    <select id="select-nom-livreur"><option value="">Chargement des livreurs...</option></select>
    <input type="password" id="input-pin" placeholder="Code PIN" maxlength="4" inputmode="numeric" autocomplete="off">
    <button id="btn-connexion" type="button">Se connecter</button>
  </div>
</div>

<div id="ecran-livreur">
  <div class="header-livreur">
    <div><div style="font-size:.75rem;opacity:.8;">Bonjour</div><div id="nom-livreur-affiche" style="font-weight:800;font-size:1.1rem;"></div><div id="maj" style="font-size:.68rem;opacity:.7;"></div></div>
    <div><button id="btn-maj" type="button" title="Actualiser"><i class="fas fa-sync-alt"></i></button><button id="btn-deco" type="button" title="Quitter"><i class="fas fa-sign-out-alt"></i></button></div>
  </div>
  <div id="bandeau"></div>
  <div id="contenu"></div>
</div>

<div class="modal" id="modal-pb"><div class="box"><h3>⚠️ Quel est le problème ?</h3><div id="motifs"></div><textarea id="pb-texte" rows="2" placeholder="Précision (facultatif)"></textarea><div class="actions"><button class="btn btn-sec" id="pb-annuler" type="button">Annuler</button><button class="btn btn-livre" id="pb-envoyer" type="button" style="background:#dc2626">Envoyer à SafeRun</button></div></div></div>
<nav id="menu" style="display:none">
  <button data-o="liv" type="button"><i class="fas fa-box"></i>Livraisons<span class="n" id="n-liv"></span></button>
  <button data-o="stock" type="button"><i class="fas fa-boxes"></i>Déstockage</button>
  <button data-o="etiq" type="button"><i class="fas fa-tags"></i>Étiquettes</button>
  <button data-o="fiche" type="button"><i class="fas fa-id-card"></i>Ma fiche</button>
</nav>
<div id="zone-impression"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzVMmVo9wnzWiCQowYZF775QE0nXAkE74pVlmaeP6pkYeGUdfd2tWyvI1hXe_55z7_G/exec";
const WA_SUPPORT = "261382453610";
const K = { acces: "saferun_livreur_acces", nom: "saferun_livreur_nom", pin: "saferun_livreur_pin", file: "saferun_livreur_file_v2", vieux: "saferun_livreur_file_attente", cache: "saferun_livreur_cache" };
const S = { nom: "", pin: "", data: null, onglet: "liv", jour: "AUJ", vague: "TOUS", hors: false, tri: "horaire", pos: null, carte: false, pbId: "", pbMotif: "" };
const MOTIFS = { INJOIGNABLE: "📵 Client injoignable", ADRESSE: "📍 Adresse introuvable", ABSENT: "🚪 Client absent", REFUSE: "✋ Client refuse la commande", PAIEMENT: "💵 Paiement incomplet ou refusé", AUTRE: "❓ Autre problème" };
let gpsId = null, dernierEnvoi = { t: 0, lat: 0, lng: 0 }, carteObj = null, couche = null;
let minuteur = null;

const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ar = n => Math.round(n || 0).toLocaleString("fr-FR") + " Ar";
const digits = t => String(t || "").replace(/\D/g, "");
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, raw(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
function wa(tel) { let d = digits(tel); if (d.indexOf("261") === 0) d = d.slice(3); d = d.replace(/^0/, ""); return d ? "https://wa.me/261" + d : ""; }

function acces() { return ls.raw(K.acces) || ""; }
function fermer404() {                                    // appareil non autorisé ou accès retiré : la page redevient « introuvable »
  localStorage.removeItem(K.acces); localStorage.removeItem(K.nom); localStorage.removeItem(K.pin); localStorage.removeItem(K.cache);
  clearInterval(minuteur); if (gpsId !== null) { navigator.geolocation.clearWatch(gpsId); gpsId = null; }
  S.nom = S.pin = ""; S.data = null; document.title = "404 Not Found";
  ["ecran-livreur", "ecran-connexion", "menu", "modal-pb"].forEach(i => { const e = $(i); if (e) e.style.display = "none"; });
  $("faux404").style.display = "block";
}
async function api(payload) {
  const r = await fetch(API, { method: "POST", body: JSON.stringify(Object.assign({ acces: acces() }, payload)) });
  const j = await r.json();
  if (j && j.acces === false) { fermer404(); throw new Error("acces"); }
  return j;
}

/* ---------- Connexion ---------- */
document.addEventListener("DOMContentLoaded", () => {
  $("btn-connexion").onclick = connecter;
  $("input-pin").addEventListener("keydown", e => { if (e.key === "Enter") connecter(); });
  $("btn-deco").onclick = deconnecter;
  $("btn-maj").onclick = () => charger(true);
  $("menu").addEventListener("click", e => { const b = e.target.closest("[data-o]"); if (b) { S.onglet = b.dataset.o; dessiner(); window.scrollTo(0, 0); } });
  $("contenu").addEventListener("click", clic);
  $("contenu").addEventListener("change", changement);
  $("motifs").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (!b) return; S.pbMotif = b.dataset.m; document.querySelectorAll("#motifs .motif").forEach(x => x.classList.toggle("on", x === b)); });
  $("pb-annuler").onclick = () => $("modal-pb").classList.remove("on"); $("pb-envoyer").onclick = envoyerProbleme;
  try { if (navigator.permissions) navigator.permissions.query({ name: "geolocation" }).then(r => { if (r.state === "granted") activerGPS(); }).catch(() => {}); } catch (e) {}
  const m = location.hash.match(/acces=([A-Za-z0-9]{12,64})/);          // lien personnel remis au livreur : le code est mémorisé puis retiré de l'adresse
  if (m) { try { localStorage.setItem(K.acces, m[1]); } catch (e) {} history.replaceState(null, "", location.pathname + location.search); }
  if (!acces()) return;                                                    // aucune autorisation : on reste sur la page « 404 », aucune requête n'est envoyée
  $("faux404").style.display = "none"; document.title = "SafeRun - Espace Livreur";
  const nom = ls.raw(K.nom), pin = ls.raw(K.pin);
  if (nom && pin) { S.nom = nom; S.pin = pin; ouvrir(); } else { $("ecran-connexion").style.display = "flex"; chargerListeLivreurs(); }
  window.addEventListener("online", () => { S.hors = false; setTimeout(vider, 800); });
  window.addEventListener("offline", () => { S.hors = true; bandeau(); });
});
async function chargerListeLivreurs() {
  try {
    const r = await api({ action: "livreurListe" }), noms = (r && r.noms) || [];
    $("select-nom-livreur").innerHTML = noms.length ? noms.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("") : '<option value="">Aucun livreur actif</option>';
  } catch (e) { if (e.message !== "acces") $("select-nom-livreur").innerHTML = '<option value="">Réseau indisponible</option>'; }
}
async function connecter() {
  const nom = $("select-nom-livreur").value, pin = $("input-pin").value.trim();
  if (!nom || pin.length !== 4) return alert("Sélectionnez votre nom et entrez votre code PIN.");
  try {
    const r = await api({ action: "livreurFiche", nom, pin });
    if (r && r.success) { S.nom = r.nom; S.pin = pin; try { localStorage.setItem(K.nom, r.nom); localStorage.setItem(K.pin, pin); } catch (e) {} S.data = r; ouvrir(true); }
    else alert(r && r.message ? r.message : "Code PIN incorrect.");
  } catch (e) { if (e.message !== "acces") alert("Erreur de connexion. Vérifiez votre réseau."); }
}
function deconnecter() {
  if (ls.get(K.file, []).length && !confirm("Des livraisons n'ont pas encore été envoyées. Quitter quand même ?")) return;
  localStorage.removeItem(K.nom); localStorage.removeItem(K.pin); localStorage.removeItem(K.cache);
  clearInterval(minuteur); if (gpsId !== null) { navigator.geolocation.clearWatch(gpsId); gpsId = null; } S.pos = null; S.nom = S.pin = ""; S.data = null;
  $("ecran-livreur").style.display = "none"; $("menu").style.display = "none"; $("ecran-connexion").style.display = "flex"; $("input-pin").value = ""; chargerListeLivreurs();
}
function ouvrir(dejaCharge) {
  $("ecran-connexion").style.display = "none"; $("ecran-livreur").style.display = "block"; $("menu").style.display = "flex"; $("nom-livreur-affiche").innerText = S.nom;
  if (!dejaCharge) { const c = ls.get(K.cache, null); if (c && c.nom === S.nom) S.data = c; }
  dessiner(); migrerVieuxFile(); charger(true); envoyerPos(true);
  clearInterval(minuteur); minuteur = setInterval(() => { if (!document.hidden) charger(false); }, 120000);
}

/* ---------- Données ---------- */
async function charger(manuel) {
  if (!S.nom) return;
  if (!navigator.onLine) { S.hors = true; bandeau(); return; }
  try {
    await vider();
    const r = await api({ action: "livreurFiche", nom: S.nom, pin: S.pin });
    if (!r || !r.success) { if (r && r.bloque) alert(r.message); else if (r && /PIN/.test(r.message || "")) { alert("Votre code PIN n'est plus valide. Reconnectez-vous."); deconnecter(); } else if (manuel) alert((r && r.message) || "Erreur de chargement."); return; }
    S.data = r; S.hors = false; ls.set(K.cache, r); dessiner(); envoyerPos(false);
  } catch (e) { S.hors = true; bandeau(); }
}
function attentes() { return ls.get(K.file, []); }
function enAttenteIds() { return attentes().filter(p => p.action === "livreurLivre").map(p => String(p.id)); }
async function vider() {
  let f = attentes(); if (!f.length || !navigator.onLine) return;
  const reste = [];
  for (const p of f) {
    try { const r = await api(Object.assign({}, p, { nom: S.nom, pin: S.pin })); if (!(r && (r.success || /introuvable|pas la vôtre|annulée/i.test(r.message || "")))) reste.push(p); }
    catch (e) { reste.push(p); }
  }
  ls.set(K.file, reste);
}
function migrerVieuxFile() {                              // anciennes livraisons en attente de l'ancienne version de la page
  const v = ls.get(K.vieux, []); if (!v.length) return;
  const f = attentes(); v.forEach(p => { if (p && p.id) f.push({ action: "livreurLivre", id: p.id }); });
  ls.set(K.file, f); localStorage.removeItem(K.vieux);
}
function bandeau() {
  const b = $("bandeau"), n = attentes().length; let t = "";
  if (S.hors || !navigator.onLine) t = "📴 Hors connexion : affichage des dernières données" + (n ? " · " + n + " livraison(s) à envoyer" : "");
  else if (n) t = "⏳ " + n + " livraison(s) en attente d'envoi";
  b.style.display = t ? "block" : "none"; b.innerText = t;
}

/* ---------- Outils métier ---------- */
const aujourdhui = () => (S.data && S.data.aujourdhui) || "";
function demain() { const d = new Date(aujourdhui() + "T12:00:00"); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); }
function commandes() { const att = enAttenteIds(); return (S.data ? S.data.commandes : []).map(c => Object.assign({ enAttente: att.indexOf(String(c.id)) !== -1 }, c)); }
function filtrer() {
  const a = aujourdhui(), d = demain();
  return commandes().filter(c => !c.enAttente).filter(c => {
    if (S.jour === "AUJ" && c.jour && c.jour > a) return false;      // aujourd'hui = aujourd'hui + retards + sans date
    if (S.jour === "DEM" && c.jour !== d) return false;
    if (S.vague !== "TOUS" && c.vague !== S.vague) return false;
    return true;
  });
}
function lignesProduits(texte) {
  const out = [];
  String(texte || "").split(/,(?![^(]*\))|\+/).forEach(it => {
    const t = it.trim(); if (!t) return;
    let m = t.match(/^(.+?)\s*\(\s*x\s*(\d+)\s*\)\s*$/i), nom, q = 1;
    if (m) { nom = m[1]; q = +m[2]; } else if ((m = t.match(/^(\d+)\s*x\s*(.+)$/i))) { q = +m[1]; nom = m[2]; } else nom = t;
    out.push({ nom: nom.trim(), q: q || 1 });
  });
  return out;

    z.innerHTML = `<div class="p-titre">BON DE SORTIE · ${esc(S.nom)} · ${date}</div><div style="font-size:12px;margin-bottom:8px">${liste.length} colis</div>` + cumul(liste).map(p => `<div class="p-ligne"><span>☐ ${esc(p.nom)}</span><b>x${p.q}</b></div>`).join("");
  } else {
    z.innerHTML = '<div class="p-grille">' + liste.map((c, i) => `<div class="p-etiq"><div class="h"><span>#${esc(c.id)}</span><span>${esc(S.nom)}</span></div><b>${esc(c.client)}</b> · ${esc(c.tel)}<br>📍 ${esc(c.adresse)}<br>📦 ${esc(c.produits)}<br>${c.mode === "LIVRAISON" ? "<b>À COLLECTER : " + (c.incertain ? "≈ " : "") + ar(c.encaisser) + "</b>" : "<b>PAYÉ</b>"}${c.cadeau ? " · 🎁 " + esc(c.cadeau) : ""}<br>${esc(libelleJour(c))} ${c.vague === "MATIN" ? "· Matin" : c.vague ? "· Après-midi" : ""}</div>` + ((i + 1) % 10 === 0 ? '<div class="p-saut"></div>' : "")).join("") + "</div>";
  }
  window.print();
}
</script>
