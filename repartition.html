<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<title>Répartition · SafeRun</title>
<style>
:root { --c: #0f766e; --tx: #0f172a; --mu: #64748b; --bd: #e2e8f0; --bg: #f1f5f9; --no: #b91c1c; --ok: #15803d; --or: #b45309; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--tx); padding-bottom: 40px; }
button { font: inherit; border: 0; border-radius: 12px; padding: 12px 15px; font-weight: 700; cursor: pointer; background: var(--c); color: #fff; }
button.sec { background: #e2e8f0; color: var(--tx); } button:disabled { opacity: .5; cursor: default; } button.petit { padding: 7px 11px; font-size: .8rem; }
input, select { font: inherit; padding: 11px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; max-width: 100%; }
.mut { color: var(--mu); font-size: .8rem; }
#connexion { max-width: 360px; margin: 10vh auto 0; padding: 0 16px; } .boite { background: #fff; border-radius: 18px; padding: 22px; box-shadow: 0 6px 24px rgba(15,23,42,.08); }
.boite h1 { font-size: 1.2rem; margin-bottom: 4px; } .boite input { width: 100%; margin: 12px 0 6px; } #err { color: var(--no); font-size: .85rem; min-height: 1.1em; margin-bottom: 8px; }
.haut { background: var(--c); color: #fff; padding: 16px 16px 24px; border-radius: 0 0 22px 22px; } .haut .l1 { display: flex; justify-content: space-between; align-items: center; gap: 10px; } .haut b { font-size: 1.2rem; } .haut small { display: block; opacity: .85; }
.haut input { padding: 8px 10px; } .haut button { background: rgba(255,255,255,.2); padding: 9px 12px; }
main { max-width: 1100px; margin: -12px auto 0; padding: 0 14px; }
.grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 12px; }
.kpi { background: #fff; border-radius: 14px; padding: 11px; box-shadow: 0 2px 10px rgba(15,23,42,.05); } .kpi b { display: block; font-size: 1.4rem; margin-top: 2px; }
.carte { background: #fff; border-radius: 16px; padding: 14px; margin-top: 12px; box-shadow: 0 2px 10px rgba(15,23,42,.05); } .carte h2 { font-size: 1rem; margin-bottom: 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 12px; } .cols .carte { margin-top: 0; }
.cmd { display: flex; gap: 8px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid #f1f5f9; } .cmd:last-child { border-bottom: 0; }
.num { background: var(--c); color: #fff; border-radius: 50%; min-width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; margin-top: 2px; }
.cmd .corps { flex: 1; font-size: .88rem; } .cmd select { padding: 6px; font-size: .8rem; max-width: 110px; }
.tag { display: inline-block; background: #e2e8f0; border-radius: 6px; padding: 1px 7px; font-size: .7rem; font-weight: 700; margin-right: 3px; } .tag.p { background: #fef3c7; color: #92400e; } .tag.r { background: #fee2e2; color: #991b1b; } .tag.n { background: #ccfbf1; color: #115e59; }
.barre { height: 8px; background: #e2e8f0; border-radius: 6px; overflow: hidden; margin: 6px 0; } .barre i { display: block; height: 100%; background: var(--c); } .barre.plein i { background: var(--no); }
.pk { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 7px 10px; font-size: .82rem; margin: 6px 0; }
.modif { background: #f0fdfa; outline: 2px solid #5eead4; border-radius: 8px; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .85rem; display: none; z-index: 50; max-width: 90%; }
a.btn { display: inline-block; text-decoration: none; background: #e2e8f0; color: var(--tx); border-radius: 10px; padding: 7px 11px; font-size: .8rem; font-weight: 700; }
</style>
</head>
<body>
<div id="faux404" style="display:none;font-family:Arial,sans-serif;text-align:center;padding:18vh 20px 0;color:#444"><h1 style="font-size:2.2rem;font-weight:600">404</h1><p style="margin-top:10px">Page introuvable</p></div>
<div id="connexion" style="display:none"><div class="boite"><h1>🧭 Répartition & tournées</h1><div class="mut">SafeRun Market · accès privé</div>
  <input id="in-mdp" type="password" placeholder="Mot de passe" autocomplete="current-password"><div id="err"></div><button id="btn-co" style="width:100%">Entrer</button></div></div>

<div id="app" style="display:none">
  <div class="haut"><div class="l1"><div><b>🧭 Répartition & tournées</b><small id="h-sub"></small></div><div style="display:flex;gap:6px"><button id="btn-maj" title="Actualiser">⟳</button><button id="btn-deco" title="Quitter">⎋</button></div></div>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label for="in-jour" style="font-size:.85rem">Jour :</label><input id="in-jour" type="date"></div></div>
  <main id="vue"></main>
</div>
<div id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzVMmVo9wnzWiCQowYZF775QE0nXAkE74pVlmaeP6pkYeGUdfd2tWyvI1hXe_55z7_G/exec";
const KA = "saferun_repartition_acces", KM = "saferun_repartition_mdp";
const S = { mdp: "", d: null, ch: {}, prop: false, jour: "" };
const $ = i => document.getElementById(i);
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const st = { g(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }, s(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, d(k) { try { localStorage.removeItem(k); } catch (e) {} }, sg(k) { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } }, ss(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, sd(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
function toast(t) { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 3200); }
(function () { const m = location.hash.match(/acces=([A-Za-z0-9]+)/); if (m) { st.s(KA, m[1]); history.replaceState(null, "", location.pathname); } })();
function fermer404() { st.d(KA); st.sd(KM); S.d = null; document.title = "404 Not Found"; ["connexion", "app"].forEach(i => $(i).style.display = "none"); $("faux404").style.display = "block"; }
async function api(p) {
  const r = await fetch(API, { method: "POST", body: JSON.stringify(Object.assign({ action: "repartition", acces: st.g(KA), mdp: S.mdp, jour: S.jour }, p)) });
  const j = await r.json(); if (j && j.acces === false) { fermer404(); throw new Error("acces"); } return j;
}
function affList() { return Object.keys(S.ch).map(id => ({ id, livreur: S.ch[id] })); }
async function charger(manuel) {
  try {
    const r = await api({ operation: S.prop || Object.keys(S.ch).length ? "apercu" : "lire", affectations: affList() });
    if (!r.success) { if (/incorrect|Trop/.test(r.message || "")) { deco(); $("err").textContent = r.message; } else toast(r.message || "Erreur"); return false; }
    S.d = r; if (!S.jour) { S.jour = r.jour; $("in-jour").value = r.jour; } dessiner(); if (manuel) toast("Actualisé"); return true;
  } catch (e) { if (e.message !== "acces") toast("Réseau indisponible"); return false; }
}
async function connecter() {
  const m = $("in-mdp").value; if (!m) return; S.mdp = m; $("err").textContent = ""; $("btn-co").disabled = true;
  try { const r = await api({ operation: "lire" }); if (r.success) { st.ss(KM, m); S.d = r; S.jour = r.jour; $("in-jour").value = r.jour; $("connexion").style.display = "none"; $("app").style.display = "block"; dessiner(); } else { $("err").textContent = r.message || "Erreur"; S.mdp = ""; } }
  catch (e) { if (e.message !== "acces") $("err").textContent = "Réseau indisponible."; }
  $("btn-co").disabled = false;
}
function deco() { st.sd(KM); S.mdp = ""; S.d = null; S.ch = {}; S.prop = false; $("app").style.display = "none"; $("connexion").style.display = "block"; $("in-mdp").value = ""; }

function livDe(o) { return o.livreur || ""; }
function carteCmd(o, i, n) {
  const modif = S.ch.hasOwnProperty(o.id);
  return `<div class="cmd ${modif ? "modif" : ""}">${i ? `<span class="num">${i}</span>` : ""}<div class="corps"><b>${esc(o.id)}</b> · ${esc(o.prenom)} ${o.retard ? '<span class="tag r">en retard</span>' : ""}${o.vague ? `<span class="tag">${o.vague === "MATIN" ? "matin" : "après-midi"}</span>` : ""}
    <div class="mut">📍 ${o.quartier ? '<span class="tag n">' + esc(o.quartier) + "</span>" : ""} ${esc(o.lieu) || "adresse non précisée"}${o.gps ? "" : " · <b>sans GPS</b>"}</div>
    ${o.partenaires.length ? `<div>${o.partenaires.map(p => `<span class="tag p">🏪 ${esc(p)}</span>`).join("")}</div>` : ""}</div>
    <select data-aff="${esc(o.id)}"><option value="">— Aucun —</option>${S.d.livreurs.map(l => `<option ${l === o.livreur ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>`;
}
function lienCarte(T, par) {
  const pts = T.ids.map(id => par[id]).filter(o => o && o.lat != null); if (!pts.length) return "";
  const dest = pts[pts.length - 1], via = pts.slice(0, -1).slice(0, 9).map(o => o.lat + "," + o.lng).join("|");
  return `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${dest.lat},${dest.lng}${via ? "&waypoints=" + encodeURIComponent(via) : ""}`;
}
function dessiner() {
  const d = S.d; if (!d) return; const par = {}; d.commandes.forEach(o => par[o.id] = o);
  const non = d.commandes.filter(o => !o.livreur), nbMod = Object.keys(S.ch).length;
  $("h-sub").textContent = d.commandes.length + " commande(s) à livrer · " + d.livreurs.length + " livreur(s) actif(s)";
  $("vue").innerHTML = `<div class="grille"><div class="kpi"><span class="mut">À répartir</span><b>${non.length}</b></div><div class="kpi"><span class="mut">Déjà attribuées</span><b>${d.commandes.length - non.length}</b></div><div class="kpi"><span class="mut">Livreurs actifs</span><b>${d.livreurs.length}</b></div><div class="kpi"><span class="mut">Capacité / livreur</span><b>${d.capacite}</b></div></div>
  ${!d.livreurs.length ? '<div class="carte"><b>Aucun livreur actif.</b><div class="mut">Ajoutez un livreur (avec son PIN) dans l\'admin pour pouvoir répartir.</div></div>' : ""}
  <div class="actions"><button id="btn-sugg" ${d.livreurs.length && non.length ? "" : "disabled"}>💡 Proposer la répartition</button><button id="btn-app" ${nbMod ? "" : "disabled"}>✅ Appliquer ${nbMod ? "(" + nbMod + ")" : ""}</button><button class="sec" id="btn-annul" ${nbMod ? "" : "disabled"}>Annuler les changements</button></div>
  ${nbMod ? `<div class="mut" style="margin-top:6px">Les changements surlignés ne sont enregistrés qu'après « Appliquer ». Rien n'est envoyé aux livreurs avant.</div>` : ""}
  ${non.length ? `<div class="carte"><h2>📥 À attribuer (${non.length})</h2>${non.map(o => carteCmd(o, 0)).join("")}</div>` : (d.commandes.length ? '<div class="carte">✅ Toutes les commandes du jour sont attribuées.</div>' : '<div class="carte">🎉 Aucune commande à livrer pour ce jour.</div>')}
  <div class="cols">${d.livreurs.map(n => { const T = d.tournees[n], pct = Math.min(100, Math.round(T.charge * 100 / d.capacite)), lien = lienCarte(T, par);
    return `<div class="carte"><h2>🛵 ${esc(n)} · ${T.charge} / ${d.capacite}</h2><div class="barre ${T.depasse ? "plein" : ""}"><i style="width:${pct}%"></i></div>${T.depasse ? '<div class="mut" style="color:var(--no)">⚠️ Au-dessus de la capacité : déplacez une commande ou recrutez.</div>' : ""}
      ${T.ramassages.length ? `<div class="pk">🏪 <b>À récupérer d'abord :</b> ${T.ramassages.map(esc).join(", ")}</div>` : ""}
      ${T.ids.length ? T.ids.map((id, i) => carteCmd(par[id], i + 1)).join("") : '<div class="mut">Aucune commande.</div>'}
      ${lien ? `<div style="margin-top:8px"><a class="btn" target="_blank" rel="noopener" href="${esc(lien)}">🗺️ Itinéraire Google Maps</a></div>` : ""}</div>`; }).join("")}</div>
  <div class="mut" style="margin:14px 0">L'ordre des arrêts est une proposition (du centre vers l'extérieur, voisin le plus proche). Le livreur garde la main sur son parcours. Cette page n'affiche aucun montant.</div>`;
}
document.addEventListener("DOMContentLoaded", () => {
  if (!st.g(KA)) { $("faux404").style.display = "block"; document.title = "404 Not Found"; return; }
  $("connexion").style.display = "block"; $("btn-co").onclick = connecter; $("in-mdp").addEventListener("keydown", e => { if (e.key === "Enter") connecter(); });
  $("btn-maj").onclick = () => charger(true); $("btn-deco").onclick = deco;
  $("in-jour").addEventListener("change", e => { S.jour = e.target.value; S.ch = {}; S.prop = false; charger(); });
  $("vue").addEventListener("change", async e => { const id = e.target.dataset && e.target.dataset.aff; if (!id) return; S.ch[id] = e.target.value; await charger(); });
  $("vue").addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "btn-sugg") { b.disabled = true; try { const r = await api({ operation: "suggerer" }); if (r.success) { Object.keys(r.nouveau || {}).forEach(id => S.ch[id] = r.nouveau[id]); S.prop = true; S.d = r; dessiner(); toast("Proposition prête : vérifiez puis « Appliquer »"); } else toast(r.message || "Erreur"); } catch (er) { if (er.message !== "acces") toast("Réseau indisponible"); } b.disabled = false; }
    else if (b.id === "btn-annul") { S.ch = {}; S.prop = false; charger(); }
    else if (b.id === "btn-app") {
      const L = affList(); if (!L.length || !confirm("Enregistrer " + L.length + " attribution(s) ? Les livreurs verront ces commandes dans leur application.")) return; b.disabled = true;
      try { const r = await api({ operation: "appliquer", affectations: L }); if (r.success) { toast(r.appliquees + " attribution(s) enregistrée(s)" + (r.ignorees ? " · " + r.ignorees + " ignorée(s)" : "")); S.ch = {}; S.prop = false; await charger(); } else toast(r.message || "Erreur"); } catch (er) { if (er.message !== "acces") toast("Réseau indisponible"); } b.disabled = false;
    }
  });
  const m = st.sg(KM); if (m) { $("in-mdp").value = m; connecter(); }
});
</script>
</body>
</html>
